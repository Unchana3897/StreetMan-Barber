<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>จัดการช่าง | StreetMan Barber Phuket</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EB1616">
    <link rel="icon" href="../img/logo.PNG">
    <link rel="manifest" href="manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="queue.css" rel="stylesheet">
</head>
<body class="staff-body queue-body dash-body">
    <header class="queue-top">
        <div>
            <p class="staff-kicker mb-1">StreetMan Barber Phuket · เจ้าของร้าน</p>
            <h1>จัดการช่าง</h1>
            <p class="staff-copy mb-0">เพิ่ม แก้ชื่อ ตั้งรหัสผ่าน หรือปิดงานช่าง คนที่ปิดงานจะไม่ขึ้นให้ลูกค้าจอง</p>
        </div>
        <div class="queue-top-actions">
            <a href="dashboard.html" class="btn btn-outline-light">กลับ Dashboard</a>
            <button type="button" class="btn btn-outline-light" id="logout-btn">ออกจากระบบ</button>
        </div>
    </header>
    <div id="toast" class="queue-toast d-none"></div>
    <main class="queue-wrap dash-wrap">
        <section class="summary-panel">
            <h2>สถานะร้าน</h2>
            <p class="staff-copy" id="shop-status-copy">ร้านเปิดรับจองออนไลน์อยู่</p>
            <button type="button" class="btn btn-outline-light" id="shop-close-btn">ปิดร้าน</button>
        </section>
        <section class="summary-panel">
            <h2>เพิ่มช่างใหม่</h2>
            <form id="add-form" class="manage-form">
                <input class="form-control" id="new-name" placeholder="ชื่อที่แสดง เช่น Ton" required maxlength="40">
                <input class="form-control" id="new-username" placeholder="ชื่อเข้าสู่ระบบ เช่น ton" required maxlength="20">
                <input class="form-control" id="new-password" type="password" placeholder="รหัสผ่านอย่างน้อย 6 ตัว" required minlength="6">
                <button class="btn btn-primary py-3" type="submit">เพิ่มช่าง</button>
            </form>
        </section>
        <section id="staff-list"></section>
    </main>
    <script src="../js/store.js"></script>
    <script src="manage.js"></script>
</body>
</html>
