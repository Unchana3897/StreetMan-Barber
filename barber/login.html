<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>เข้าสู่ระบบช่าง | StreetMan Barber</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../img/logo.PNG">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="คิวช่าง">
    <link rel="apple-touch-icon" href="../img/logo.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="queue.css" rel="stylesheet">
</head>
<body class="staff-body">
    <div class="staff-card">
        <p class="staff-kicker">StreetMan Barber</p>
        <h1>เข้าสู่ระบบช่าง</h1>
        <p class="staff-copy">ชื่อผู้ใช้: <strong>rim</strong>, <strong>bank</strong>, <strong>rick</strong> หรือ <strong>dee</strong><br>รหัสผ่าน: <strong>StreetMan2026</strong></p>
        <p class="staff-copy">เข้าแล้วจะเห็นเฉพาะคนที่จองกับตัวเอง เปิดหน้านี้ค้างไว้บนมือถือ คิวใหม่จะขึ้นทันที</p>
        <form id="login-form">
            <label for="username">ชื่อผู้ใช้</label>
            <input id="username" class="form-control" autocomplete="username" required>
            <label for="password">รหัสผ่าน</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" required>
            <p id="login-error" class="staff-error d-none"></p>
            <button class="btn btn-primary w-100 py-3 mt-3" type="submit">เข้าสู่ Dashboard</button>
        </form>
    </div>
    <script src="../js/store.js"></script>
    <script src="login.js"></script>
</body>
</html>
