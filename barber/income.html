<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <title>รายได้ช่าง | StreetMan Barber Phuket</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#EB1616">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="รายได้ช่าง">
    <link rel="icon" href="../img/logo.PNG">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="../img/logo.PNG">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600&family=Oswald:wght@600&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="../css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/style.css" rel="stylesheet">
    <link href="queue.css" rel="stylesheet">
</head>
<body class="staff-body queue-body dash-body">
    <header class="queue-top">
        <div>
            <p class="staff-kicker mb-1">StreetMan Barber Phuket · รายได้</p>
            <h1 id="barber-name">รายได้ของฉัน</h1>
            <p class="staff-copy mb-0">นับเฉพาะคิวที่กดตัดเสร็จแล้ว</p>
        </div>
        <div class="queue-top-actions">
            <button type="button" class="btn btn-outline-light" id="prev-day" aria-label="วันก่อนหน้า"><i class="fa fa-chevron-left"></i></button>
            <input type="date" id="income-date" class="form-control">
            <button type="button" class="btn btn-outline-light" id="today-btn">วันนี้</button>
            <button type="button" class="btn btn-outline-light" id="next-day" aria-label="วันถัดไป"><i class="fa fa-chevron-right"></i></button>
            <button type="button" class="btn btn-outline-light d-none" id="export-week">Excel สัปดาห์</button>
            <button type="button" class="btn btn-outline-light d-none" id="export-month">Excel เดือน</button>
            <a href="dashboard.html" class="btn btn-outline-light">หน้าคิว</a>
            <a href="manage.html" class="btn btn-primary d-none" id="manage-link">จัดการช่าง</a>
            <button type="button" class="btn btn-outline-light" id="logout-btn">ออกจากระบบ</button>
        </div>
    </header>
    <div id="toast" class="queue-toast d-none"></div>
    <main class="queue-wrap dash-wrap">
        <section class="summary-panel">
            <div class="summary-grid is-3" id="income-cards"></div>
        </section>
        <section class="summary-panel">
            <h2>กราฟสัปดาห์นี้</h2>
            <p class="staff-copy" id="week-range">—</p>
            <div class="chart-bars" id="week-chart"></div>
        </section>
        <section class="summary-panel">
            <h2 id="month-chart-title">กราฟเดือนนี้</h2>
            <div class="chart-bars is-month" id="month-chart"></div>
        </section>
        <section id="shop-income" class="shop-panel d-none"></section>
    </main>
    <script src="../js/store.js"></script>
    <script src="income.js"></script>
</body>
</html>
